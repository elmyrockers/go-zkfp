name: Integration Test

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Verify Go
        run: go version

      - name: Run integration tests
        run: go test -tags integration -run TestIntegration -v -count=1 .